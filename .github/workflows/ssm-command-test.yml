
name: AWS SSM Command Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-ssm:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::711107785800:role/JapaneseLessonGitHubDeployRole
          aws-region: ap-northeast-1

      - name: Execute hostname on EC2 via SSM
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-0f4682b17a510433a"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["hostname"]}' \
            --comment "GitHub Actions hostname test" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json
