
name: Deploy Japanese with Ted

on:
  workflow_dispatch:
    inputs:
      simulate_ci_failure:
        description: "CI失敗をテストする"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - index.html
      - videos.html
      - css/videos.css
      - js/videos.js

permissions:
  id-token: write
  contents: read

concurrency:
  group: japanese-lesson-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Validate public site
        shell: bash
        run: |
          set -euo pipefail

          for FILE in index.html videos.html css/videos.css js/videos.js; do
            test -s "$FILE"
            echo "File OK: $FILE"
          done

          for HTML in index.html videos.html; do
            grep -qi '<!DOCTYPE html' "$HTML"
            grep -qi '</html>' "$HTML"
            echo "HTML basic checks passed: $HTML"
          done

          node --check js/videos.js
          echo "JavaScript syntax passed"
      
      - name: Lint HTML with HTMLHint
        shell: bash
        run: |
          set -euo pipefail
          npx --yes htmlhint \
            --rules doctype-first,tag-pair,attr-no-duplication,id-unique \
            index.html videos.html

      - name: Test CI with invalid HTML
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_ci_failure }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<html><body><ul><li></ul></body></html>' \
            > broken-test.html

          npx --yes htmlhint --rules tag-pair broken-test.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::711107785800:role/JapaneseLessonGitHubDeployRole
          aws-region: ap-northeast-1

      - name: Deploy via SSM
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-0f4682b17a510433a"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters  "$(jq -nc --arg sha "$GITHUB_SHA" \
          '{commands:[("/usr/local/sbin/ted-deploy.sh " + $sha)]}')" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          RESULT=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          exit "$RESULT"
